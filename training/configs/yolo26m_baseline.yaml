# Cấu hình huấn luyện YOLO26m - Server RTX 5070 Ti (16 GB VRAM, dùng chung)
# Dùng bởi training/train.py (mặc định); mọi khóa (trừ nhóm "Khóa riêng") được truyền thẳng vào
# ultralytics model.train() - tham khảo ultralytics/cfg/default.yaml (ultralytics==8.4.172).
#
# YOLO26 khác YOLOv8: head end-to-end NMS-free (nhánh one2one, top-k 300) và không có DFL (reg_max=1).
# Huấn luyện dùng đồng thời nhánh one2many + one2one (E2E loss) - Ultralytics tự xử lý, không cần đổi code.

# ---- Dữ liệu & mô hình ----
model: yolo26m.pt                    # trọng số COCO pretrained (~20M tham số), tự tải về lần đầu
data: datasets/processed/data.yaml   # sinh bởi data_engineering/clean_and_filter.py
imgsz: 640                           # bội số của 32, cố định cho NPU Hailo-8

# ---- Lịch huấn luyện ----
epochs: 300
patience: 50          # Early Stopping theo fitness = mAP@0.5:0.95 trên val
batch: 16             # YOLO26m@640 + AMP ~10 GB VRAM; chừa chỗ cho người dùng chung GPU (batch=0.6 -> AutoBatch 60% VRAM)
workers: 8
cache: false
amp: true             # FP16 (PyTorch CUDA 12.8+ cho Blackwell sm_120)
device: 0

# ---- Optimizer & LR schedule ----
# Ultralytics chọn MuSGD (lr0=0.01) cho YOLO26 khi optimizer=auto và > 10k iteration; giữ AdamW để so
# sánh công bằng với baseline YOLOv8n. Muốn thử MuSGD: optimizer: MuSGD, lr0: 0.01, momentum: 0.9.
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_bias_lr: 0.0   # BẮT BUỘC với Adam/AdamW (mặc định 0.1 dành cho SGD)
close_mosaic: 10

# ---- Tăng cường dữ liệu (mô phỏng điều kiện sa bàn) ----
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.5
shear: 2.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0

# ---- Tái lập & nhật ký ----
seed: 42
deterministic: true
project: runs/train
name: yolo26m_baseline
exist_ok: false
plots: true

# ---- Khóa riêng của training/train.py (KHÔNG truyền vào Ultralytics) ----
tensorboard: true
image_weights: true
image_weights_power: 0.5
best_weights_out: models/best.pt   # các script sau (export/calib/compile/edge) đọc mặc định models/best.pt
